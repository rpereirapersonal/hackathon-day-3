[project]
name = "market-signal-agent"
version = "0.1.0"
description = "Evidence-grounded market signal agent over RBA, ASX and AFR data"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["src", "src.tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests and the calibration harness both live in training/, which is
# deliberately not a package — pytest collects it by path (brief §8 folder set).
testpaths = ["training"]
